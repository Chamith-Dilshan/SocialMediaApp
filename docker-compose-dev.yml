services:
  postgres:
    image: postgres:18
    container_name: social_media_postgres
    restart: always
    environment:
      POSTGRES_DB: social-media-app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: N3#%lbL

    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d social-media-app" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build: .
    restart: always
    #      env_file:
    #        - .env
    environment:
      - APP_NAME=SocialMediaApp
      - APP_VERSION=1.0.0
      - DEBUG=True

      - API_V1_PREFIX=/api/v1

      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=social-media-app
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=N3#%lbL

      - TEST_DB=social-media-app-test

      - SECRET_KEY=b28ff2578a40e4f5f5129362a3831991b2c5841cd015e0f4e8a1ae2da1491bca
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60

    #<port on local>: <port on container>
    ports:
      - "8000:8000"

    volumes:
      # Development only: to sync local source code into the container
      # Production, you can use .:/src:ro to preventing writes from inside the container.
      - .:/src
      - /src/.venv
    depends_on:
      postgres:
        condition: service_healthy
    # Only for development environment for overriding doker-image command
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8000


volumes:
  postgres_data: